name: R4 syntax repair

on:
  push:
    branches:
      - fix/r4-r5-validation-pass-2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r4-r5-validation-pass-2
      - name: Repair remaining Kotlin parser errors
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('android/app/src/main/java/com/salespunch360/mobile/ui/AppShell.kt')
          text = app.read_text()
          old = 'label={Text(item.label)})}}}\n    ){padding->'
          new = 'label={Text(item.label)})}}}}\n    ){padding->'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('AppShell target not found')
          app.write_text(text)

          sales = Path('android/app/src/main/java/com/salespunch360/mobile/ui/SalesDrawerShell.kt')
          text = sales.read_text()
          marker = 'private fun salesDrawerTime(value:String)=runCatching{java.time.OffsetDateTime.parse(value).atZoneSameInstant(java.time.ZoneId.of("Asia/Kolkata")).format(java.time.format.DateTimeFormatter.ofPattern("h:mm a"))}.getOrDefault(value)'
          if not text.rstrip().endswith(marker):
              if text.rstrip().endswith(marker + '\n}'):
                  pass
              else:
                  raise SystemExit('SalesDrawerShell target not found')
          else:
              text = text.rstrip() + '\n}\n'
              sales.write_text(text)
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/salespunch360/mobile/ui/AppShell.kt android/app/src/main/java/com/salespunch360/mobile/ui/SalesDrawerShell.kt
          git commit -m "Fix remaining R4 Kotlin parser errors"
          git push origin HEAD:fix/r4-r5-validation-pass-2
