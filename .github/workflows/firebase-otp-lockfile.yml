name: Security dependency lockfile

on:
  push:
    branches:
      - fix/hostinger-dependency-security
    paths:
      - package.json
      - .github/workflows/firebase-otp-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/fix/hostinger-dependency-security'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update lockfile from npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(security): synchronize npm lockfile"
          git push origin HEAD:fix/hostinger-dependency-security
