name: Production Prisma Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-migrations:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate production database secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "Required DATABASE_URL or DIRECT_URL repository secret is unavailable." >&2
            exit 1
          fi

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Check migration status before deployment
        continue-on-error: true
        run: npx --no-install prisma migrate status

      - name: Deploy pending migrations
        run: npm run db:migrate:deploy

      - name: Verify migration status after deployment
        run: npx --no-install prisma migrate status

