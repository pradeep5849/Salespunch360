name: Provision Initial Super Admin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision-initial-super-admin:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Provision initial Super Admin
        env:
          INITIAL_SUPER_ADMIN_EMAIL: ${{ secrets.INITIAL_SUPER_ADMIN_EMAIL }}
          INITIAL_SUPER_ADMIN_PASSWORD: ${{ secrets.INITIAL_SUPER_ADMIN_PASSWORD }}
        run: npm run provision:initial-super-admin

