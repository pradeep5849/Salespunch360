name: Temporary Next.js security upgrade

on:
  push:
    branches:
      - security/next-16.3.8

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/next-16.3.8
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install next@16.3.8 --save-exact --package-lock-only
      - name: Commit dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes needed"
          else
            git commit -m "fix(security): upgrade Next.js to 16.3.8"
            git push origin HEAD:security/next-16.3.8
          fi
