name: R4 validation

# Validation workflow also serves as the isolated R4/R5 repair-branch gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  android:
    name: Android unit and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Run Android unit tests and lint only
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease
