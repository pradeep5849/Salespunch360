name: Root host diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-host-check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare DNS TLS and redirect paths
        shell: bash
        run: |
          for host in salespunch360.com www.salespunch360.com; do
            echo "HOST=$host"
            dig +short "$host" A
            dig +short "$host" AAAA
            for scheme in http https; do
              echo "URL=$scheme://$host/"
              curl -sS --max-time 25 -D - -o /dev/null "$scheme://$host/" || true
              echo "REDIRECT_CHAIN=$scheme://$host/"
              curl -sS -L --max-redirs 6 --max-time 35 -D - -o /dev/null -w 'FINAL_STATUS=%{http_code} FINAL_URL=%{url_effective}\n' "$scheme://$host/" || true
            done
          done
