name: Public website mobile and desktop audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    name: Lighthouse ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        device: [mobile, desktop]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Audit the public homepage
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          mkdir -p reports
          if [ "$DEVICE" = desktop ]; then
            npm exec --yes --package=lighthouse@13.6.0 -- lighthouse https://www.salespunch360.com/ --preset=desktop --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output=html --output-path=reports/lighthouse --quiet
          else
            npm exec --yes --package=lighthouse@13.6.0 -- lighthouse https://www.salespunch360.com/ --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output=html --output-path=reports/lighthouse --quiet
          fi
      - name: Summarize measured results
        run: node scripts/summarize-public-lighthouse.mjs reports/lighthouse.report.json reports/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-lighthouse-${{ matrix.device }}
          path: reports/
