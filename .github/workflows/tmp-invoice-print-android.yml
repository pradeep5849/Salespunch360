name: Temporary invoice print Android patch

on:
  push:
    branches:
      - feature/invoice-print-settings-reference

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/invoice-print-settings-reference
      - name: Wire native Invoice Print screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/salespunch360/mobile/ui/account/admin/AccountAdministrationScreen.kt')
          s=p.read_text()
          old='"print-templates" -> TemplateView(state.data, vm)'
          new='"print-templates" -> InvoicePrintSettingsView(state.data, vm)'
          if old not in s:
              raise SystemExit('Invoice Print route not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit Android parity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/salespunch360/mobile/ui/account/admin/AccountAdministrationScreen.kt
          git commit -m "feat(android): wire Invoice Print reference screen"
          git push origin HEAD:feature/invoice-print-settings-reference
