private fun InvoicePrintSectionTitle(title:String){
    Surface(color=MaterialTheme.colorScheme.primaryContainer,modifier=Modifier.fillMaxWidth()){
        Text(title,Modifier.padding(horizontal=16.dp,vertical=10.dp),fontWeight=FontWeight.Bold,color=MaterialTheme.colorScheme.onPrimaryContainer)
    }
}

@Composable
private fun InvoicePrintSwitchRow(label:String,value:Boolean,onChange:(Boolean)->Unit){
    ListItem(headlineContent={Text(label)},supportingContent={Text("ⓘ",color=MaterialTheme.colorScheme.onSurfaceVariant)},trailingContent={Switch(value,onChange)})
}

@Composable
private fun InvoicePrintValueRow(label:String,value:String,onChange:(String)->Unit){
    Row(Modifier.fillMaxWidth().padding(horizontal=16.dp,vertical=8.dp),verticalAlignment=Alignment.CenterVertically){
        Text(label,Modifier.weight(1f))
        OutlinedTextField(value,onChange,singleLine=true,modifier=Modifier.widthIn(min=150.dp,max=230.dp))
    }
}

@Composable
private fun InvoicePrintStepper(label:String,value:Int,onChange:(Int)->Unit){
    Row(Modifier.fillMaxWidth().padding(horizontal=16.dp,vertical=8.dp),verticalAlignment=Alignment.CenterVertically){
        Text(label,Modifier.weight(1f))
        IconButton(onClick={onChange((value-1).coerceAtLeast(0))}){Text("−")}
        Text(value.toString(),style=MaterialTheme.typography.titleMedium)
        IconButton(onClick={onChange((value+1).coerceAtMost(50))}){Text("+")}
    }
}

