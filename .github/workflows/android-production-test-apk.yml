name: Android production test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-test-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Require repository owner for permanent signing
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: test "$ACTOR" = "$OWNER"

      - name: Check out requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate permanent keystore, both passwords and pinned fingerprints
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/android-signing/permanent-apk.py prepare

      - name: Inject Firebase configuration
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Required FIREBASE_GOOGLE_SERVICES_JSON_BASE64 repository secret is unavailable." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Run Android unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Zip-align, permanently sign, and verify release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/android-signing/permanent-apk.py sign

      - name: Verify production connection and network security
        shell: bash
        run: |
          set -euo pipefail

          readonly APK="SalesPunch360-production-test.apk"
          readonly APK_STRINGS="$RUNNER_TEMP/SalesPunch360-production-test.strings"
          readonly MANIFEST="$RUNNER_TEMP/SalesPunch360-production-test-manifest.xml"

          unzip -p "$APK" | strings > "$APK_STRINGS"
          grep -Fq "https://www.salespunch360.com/" "$APK_STRINGS"
          if grep -Eiq '10\.0\.2\.2|localhost' "$APK_STRINGS"; then
            echo "The final APK contains a forbidden development host." >&2
            exit 1
          fi

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > "$MANIFEST"
          grep -Eq 'android:usesCleartextTraffic="false"|usesCleartextTraffic="false"' "$MANIFEST"

      - name: Upload production test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SalesPunch360-production-test-apk
          path: |
            SalesPunch360-production-test.apk
            SalesPunch360-production-test-certificate.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material and Firebase configuration
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/salespunch360-permanent-signing"
          rm -f android/app/google-services.json

