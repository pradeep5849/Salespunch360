name: Targeted validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Billing, entitlement and workflow regression tests
        run: npx vitest run src/lib/billing/combined-order.test.ts src/lib/billing/current-term.test.ts src/lib/billing/entitlement.test.ts src/lib/billing/seat-reduction.test.ts src/lib/billing/telecaller-surface.contract.test.ts src/lib/account/won-project-handoff.contract.test.ts src/lib/telecalling/lead-telecalling-ui.contract.test.ts src/lib/workspace/final-ui.contract.test.ts src/lib/visits/immutable-reference.test.ts src/lib/visits/lead-linked-new-checkin.test.ts
      - name: Sale invoice save and inventory regression
        run: npx vitest run src/lib/account/transaction-header.test.ts src/lib/account/sale-duplicate.test.ts src/lib/account/project-invoice-selection.test.ts src/lib/account/sale-submit.test.ts src/app/actions/commercial.test.ts src/lib/account/sale-invoice-save.runtime.test.ts src/lib/account/sale-warehouse.test.ts src/lib/account/commercial-action-errors.test.ts src/lib/account/commercial.runtime.test.ts src/lib/account/reports/catalogue.test.ts src/lib/account/item-pricing.test.ts src/lib/account/sale-price-updates.test.ts src/lib/account/customer-price-options.test.ts src/lib/account/customer-price-selection.test.ts src/lib/account/item-photo-upload.test.ts src/lib/account/expense-items.test.ts src/lib/account/item-opening.test.ts src/lib/account/cheque-transaction-target.test.ts src/lib/account/cheque-list.test.ts src/lib/account/y04-print-coverage.test.ts src/lib/account/invoice-print-toggle-consumers.test.ts src/lib/account/commercial.contract.test.ts src/lib/account/inventory.test.ts src/lib/account/inventory-policy.test.ts src/lib/account/project-purchase-inventory.runtime.test.ts src/lib/account/tax.test.ts src/lib/accounting/service.runtime.test.ts
      - name: Dashboard company date formatting regression
        run: npx vitest run src/app/workspace/account/dashboard/page.test.tsx src/lib/account/display-preferences.test.ts src/components/account/account-ui.test.tsx src/lib/account/dashboard-policy.test.ts
      - name: Backup snapshot and scheduling regression
        run: npx vitest run src/lib/account/backup-private-files.test.ts src/app/api/account/utilities/backup/route.test.ts src/app/api/v1/mobile/account/backup/route.test.ts src/lib/account/backup-snapshot.runtime.test.ts src/lib/account/backup-settings.runtime.test.ts
      - name: Private Sale multipart, authorization and explicit Save transport
        run: npx vitest run src/lib/account/sale-attachment-http.test.ts src/lib/account/sale-attachment-routes.test.ts src/lib/account/sale-attachment-upload.test.ts src/lib/quotations/attachment-http.test.ts src/lib/quotations/creation-attachments-route.test.ts
      - name: Money mutation validation boundaries
        run: npx vitest run src/app/api/v1/mobile/account/money src/lib/account/action-feedback.test.ts src/lib/mobile/money-validation-feedback.test.ts
      - name: Scoped notification tabs and existing alert permissions
        run: npx vitest run src/lib/account/notification-tabs.test.ts src/lib/account/expense-alerts.test.ts src/app/api/v1/mobile/account/notifications/route.test.ts
      - name: Immutable printed invoice revision identity
        run: npx vitest run src/lib/account/sale-invoice-identity.test.ts src/lib/account/invoice-share.test.ts
      - name: Quotation theme layouts and scoped settings
        run: npx vitest run src/lib/quotations/themed-pdf.test.ts src/lib/quotations/theme-settings.test.ts src/lib/quotations/print-presentation.test.ts src/lib/quotations/pdf.test.ts
      - name: Order quantity and estimate billing domains
        run: npx vitest run src/lib/account/orders/fulfilment.test.ts src/lib/quotations/billing.test.ts src/lib/account/reports/order-reports.test.ts src/lib/account/reports/catalogue.test.ts src/lib/account/reports/queries.test.ts
      - name: Exact unit quantity and immutable snapshot guards
        run: npx vitest run src/lib/account/unit-quantities.test.ts src/lib/account/item-selected-unit-pricing.test.ts src/lib/account/retained-line-discount.test.ts src/lib/account/commercial-unit-snapshot.test.ts src/lib/account/commercial-stock-quantity.test.ts src/lib/account/project-purchase-returns.test.ts src/lib/account/commercial-project-input.test.ts
      - name: Report selectors and exact financial breakdowns
        run: npx vitest run src/components/account/account-timestamp.test.tsx src/lib/account/reports/classification-sales.test.ts src/lib/account/reports/withholding.test.ts src/lib/account/loan-opening-fee.test.ts src/lib/account/reports/loan-statement.test.ts src/lib/account/reports/service-boundaries.test.ts src/lib/account/reports/item-discount.test.ts src/lib/account/reports/item-serial.test.ts src/lib/account/reports/gst-rate.test.ts src/lib/account/reports/party-trade.test.ts src/lib/account/reports/profit-presentation.test.ts src/lib/account/reports/stock-level.test.ts src/lib/account/reports/bank-statement.test.ts src/lib/account/reports/stock-detail-options.test.ts src/lib/account/reports/stock-detail.test.ts src/lib/account/reports/stock-category.test.ts src/lib/account/reports/catalogue.test.ts src/lib/account/stock-summary-report.test.ts src/lib/account/reports/cash-bank.test.ts src/lib/account/reports/ledger-breakdown.test.ts src/lib/account/reports/purchase-register.test.ts src/lib/account/reports/queries.test.ts
      - name: Quotation preview and authoritative calculation regression
        run: npx vitest run src/lib/quotations/creation-attachments-route.test.ts src/lib/quotations/attachment-http.test.ts src/lib/quotations/conversion-preview.test.ts src/lib/quotations/sale-prefill.test.ts src/lib/quotations/action-capabilities.test.ts src/app/api/v1/mobile/account/transactions/\[id\]/confirm/route.test.ts src/app/api/v1/mobile/account/quotations/\[id\]/conversion-preview/route.test.ts src/lib/quotations/commercial-prefill.test.ts src/lib/quotations/party-balance.test.ts src/lib/quotations/stock-options.test.ts src/lib/mobile/master-validation-feedback.test.ts src/app/actions/account-party-creation.test.ts src/lib/account/party-create.runtime.test.ts src/lib/quotations/calculation.test.ts src/lib/quotations/service.runtime.test.ts src/lib/quotations/pdf.test.ts
      - name: Purchase master pricing preview
        run: npx vitest run src/lib/account/commercial-editor-pricing.test.ts src/lib/account/item-pricing.test.ts src/lib/account/purchase-editor-lineage.test.ts
      - run: npm run typecheck
      - run: npm run lint

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Android unit tests and lint
        working-directory: android
        run: ./gradlew testReleaseUnitTest lintRelease --no-daemon


  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migration_fixture
          POSTGRES_PASSWORD: ci-only-migration-password
          POSTGRES_DB: migration_rehearsal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_fixture -d migration_rehearsal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Fresh migration chain and data-preserving shipping upgrade
        env:
          ACCOUNT_MIGRATION_REHEARSAL_DATABASE_URL: postgresql://migration_fixture:ci-only-migration-password@127.0.0.1:5432/migration_rehearsal_ci
        run: npx vitest run src/lib/account/migration-chain.integration.test.ts --maxWorkers=1
      - name: Backup tenant isolation and reusable expense item retention
        env:
          ACCOUNT_CHECKPOINT_DATABASE_URL: postgresql://migration_fixture:ci-only-migration-password@127.0.0.1:5432/migration_rehearsal_ci
        run: npx vitest run src/lib/account/backup-expense-items.integration.test.ts src/lib/account/reports/date-storage.integration.test.ts --maxWorkers=1
      - name: Quotation attachment retries, access and immutable revision history
        env:
          ACCOUNT_CHECKPOINT_DATABASE_URL: postgresql://migration_fixture:ci-only-migration-password@127.0.0.1:5432/migration_rehearsal_ci
        run: npx vitest run src/lib/quotations/attachments.integration.test.ts src/lib/quotations/draft-audit.integration.test.ts --maxWorkers=1
      - name: Quotation approved conversion, atomic Sale and order confirmation
        env:
          ACCOUNT_CHECKPOINT_DATABASE_URL: postgresql://migration_fixture:ci-only-migration-password@127.0.0.1:5432/migration_rehearsal_ci
        run: npx vitest run src/lib/quotations/commercial-link.integration.test.ts --maxWorkers=1
      - name: Sale private file atomicity, retries, access and immutable history
        env:
          ACCOUNT_CHECKPOINT_DATABASE_URL: postgresql://migration_fixture:ci-only-migration-password@127.0.0.1:5432/migration_rehearsal_ci
        run: npx vitest run src/lib/account/sale-attachments.integration.test.ts src/lib/account/private-document-files.test.ts src/lib/account/sale-submit.test.ts --maxWorkers=1
      - name: Commercial primary-unit snapshots and historical corrections
        env:
          ACCOUNT_CHECKPOINT_DATABASE_URL: postgresql://migration_fixture:ci-only-migration-password@127.0.0.1:5432/migration_rehearsal_ci
        run: npx vitest run src/lib/account/commercial-unit-history.integration.test.ts --maxWorkers=1
      - name: Loan opening fee choice, financial atomicity and history
        env:
          ACCOUNT_CHECKPOINT_DATABASE_URL: postgresql://migration_fixture:ci-only-migration-password@127.0.0.1:5432/migration_rehearsal_ci
        run: npx vitest run src/lib/account/money-edit.integration.test.ts --maxWorkers=1
