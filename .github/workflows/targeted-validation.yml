name: Targeted validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Billing and entitlement regression tests
        run: npx vitest run src/lib/billing/combined-order.test.ts src/lib/billing/entitlement.test.ts src/lib/billing/seat-reduction.test.ts
      - run: npm run typecheck
      - run: npm run lint

  android-changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'

  android:
    needs: android-changes
    if: ${{ needs.android-changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android unit tests and lint
        working-directory: android
        run: ./gradlew testReleaseUnitTest lintRelease --no-daemon
