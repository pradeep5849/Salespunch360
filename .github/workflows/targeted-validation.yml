name: Targeted validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Billing and entitlement regression tests
        run: npx vitest run src/lib/billing/combined-order.test.ts src/lib/billing/current-term.test.ts src/lib/billing/entitlement.test.ts src/lib/billing/seat-reduction.test.ts
      - run: npm run typecheck
      - run: npm run lint

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android unit tests, lint and debug APK
        working-directory: android
        run: ./gradlew testReleaseUnitTest lintRelease assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: salespunch360-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
