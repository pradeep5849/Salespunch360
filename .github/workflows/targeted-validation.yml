name: Targeted validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Billing, entitlement and workflow regression tests
        run: npx vitest run src/lib/billing/combined-order.test.ts src/lib/billing/current-term.test.ts src/lib/billing/entitlement.test.ts src/lib/billing/seat-reduction.test.ts src/lib/billing/telecaller-surface.contract.test.ts src/lib/account/won-project-handoff.contract.test.ts src/lib/telecalling/lead-telecalling-ui.contract.test.ts src/lib/workspace/final-ui.contract.test.ts src/lib/visits/immutable-reference.test.ts src/lib/visits/lead-linked-new-checkin.test.ts
      - name: Sale invoice save and inventory regression
        run: npx vitest run src/lib/account/sale-submit.test.ts src/app/actions/commercial.test.ts src/lib/account/sale-invoice-save.runtime.test.ts src/lib/account/sale-warehouse.test.ts src/lib/account/commercial-action-errors.test.ts src/lib/account/commercial.runtime.test.ts src/lib/account/reports/catalogue.test.ts src/lib/account/backup-snapshot.runtime.test.ts src/lib/account/item-pricing.test.ts src/lib/account/sale-price-updates.test.ts src/lib/account/customer-price-options.test.ts src/lib/account/customer-price-selection.test.ts src/lib/account/item-photo-upload.test.ts src/lib/account/expense-items.test.ts src/lib/account/item-opening.test.ts src/lib/account/cheque-transaction-target.test.ts src/lib/account/cheque-list.test.ts src/lib/account/y04-print-coverage.test.ts src/lib/account/invoice-print-toggle-consumers.test.ts src/lib/account/commercial.contract.test.ts src/lib/account/inventory.test.ts src/lib/account/inventory-policy.test.ts src/lib/account/project-purchase-inventory.runtime.test.ts src/lib/account/tax.test.ts src/lib/accounting/service.runtime.test.ts
      - name: Money mutation validation boundaries
        run: npx vitest run src/app/api/v1/mobile/account/money src/lib/account/action-feedback.test.ts src/lib/mobile/money-validation-feedback.test.ts
      - name: Exact unit quantity and immutable snapshot guards
        run: npx vitest run src/lib/account/unit-quantities.test.ts src/lib/account/commercial-unit-snapshot.test.ts
      - name: Report selectors and exact financial breakdowns
        run: npx vitest run src/lib/account/reports/cash-bank.test.ts src/lib/account/reports/ledger-breakdown.test.ts src/lib/account/reports/purchase-register.test.ts src/lib/account/reports/queries.test.ts
      - name: Quotation preview and authoritative calculation regression
        run: npx vitest run src/lib/quotations/commercial-prefill.test.ts src/lib/quotations/party-balance.test.ts src/lib/quotations/stock-options.test.ts src/lib/mobile/master-validation-feedback.test.ts src/app/actions/account-party-creation.test.ts src/lib/account/party-create.runtime.test.ts src/lib/quotations/calculation.test.ts src/lib/quotations/service.runtime.test.ts src/lib/quotations/pdf.test.ts
      - name: Purchase master pricing preview
        run: npx vitest run src/lib/account/commercial-editor-pricing.test.ts src/lib/account/item-pricing.test.ts src/lib/account/purchase-editor-lineage.test.ts
      - run: npm run typecheck
      - run: npm run lint

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Android unit tests and lint
        working-directory: android
        run: ./gradlew testReleaseUnitTest lintRelease --no-daemon

