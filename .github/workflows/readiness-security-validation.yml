name: Readiness security rehearsal
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "scripts/production-readiness/**"
      - "prisma/migrations/20261025*/**"
      - ".github/workflows/readiness-security-validation.yml"
  pull_request:
    paths:
      - "scripts/production-readiness/**"
      - "prisma/migrations/20261025*/**"
      - ".github/workflows/readiness-security-validation.yml"
permissions:
  contents: read
jobs:
  isolated-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: readiness
          POSTGRES_PASSWORD: isolated-ci-fixture-only
          POSTGRES_DB: verified_readiness_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U readiness -d verified_readiness_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      READINESS_DATABASE_URL: postgresql://readiness:isolated-ci-fixture-only@127.0.0.1:5432/verified_readiness_ci
      PGPASSWORD: isolated-ci-fixture-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: node scripts/production-readiness/bootstrap-baseline.mjs
      - name: Create synthetic Supabase role and grant fixture
        run: |
          psql -h 127.0.0.1 -U readiness -d verified_readiness_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          GRANT ALL ON ALL TABLES IN SCHEMA public TO anon,authenticated,service_role;
          GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO anon,authenticated,service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon,authenticated,service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO anon,authenticated,service_role;
          SQL
      - name: Rehearse native forward migrations, preserved credentials, role boundary and defaults
        run: node scripts/production-readiness/rehearse.mjs
      - run: npx vitest run scripts/production-readiness/data-api-probe.test.ts
      - name: Verify staged runner approval and first-failure guards
        run: node --test scripts/production-readiness/execute.node-check.mjs scripts/production-readiness/staged-migration.node-check.mjs
      - name: Rehearse with a non-superuser application owner
        run: |
          psql -h 127.0.0.1 -U readiness -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE readiness_backend LOGIN PASSWORD 'isolated-owner-fixture';
          CREATE DATABASE staged_readiness_ci OWNER readiness_backend;
          SQL
          export READINESS_DATABASE_URL=postgresql://readiness_backend:isolated-owner-fixture@127.0.0.1:5432/staged_readiness_ci
          export PGPASSWORD=isolated-owner-fixture
          node scripts/production-readiness/bootstrap-baseline.mjs
          psql -h 127.0.0.1 -U readiness_backend -d staged_readiness_ci -v ON_ERROR_STOP=1 <<'SQL'
          GRANT ALL ON ALL TABLES IN SCHEMA public TO anon,authenticated,service_role;
          GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO anon,authenticated,service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon,authenticated,service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO anon,authenticated,service_role;
          SQL
          READINESS_ROLLBACK_PATH="$RUNNER_TEMP/synthetic-rollback.sql" node scripts/production-readiness/rehearse-staged.mjs
